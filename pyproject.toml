[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Tudo"
version = "0.1.0"
description = "Taxonomy of utterances and dynamic oscillations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache 2.0" } 
authors = [
  { name = "Sem Ribeiro Albuquerque Wendt", email = "sem@16161d.net" }
]

dependencies = [
  "numpy",
  "matplotlib"
]

[project.urls]
Homepage = "https://github.com/sem-16161d/Tudo"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]